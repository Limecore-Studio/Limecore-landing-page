<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Account confirmed — Limecore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0A0A; --surface: #111111; --border: #1A1A1A;
      --accent: #A3E635; --danger: #f87171;
      --text: #F5F5F5; --muted: #737373;
      --fdisplay: 'Oxanium', sans-serif; --fmono: 'Space Mono', monospace;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--fdisplay);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 32px 20px; -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 460px; }
    .wordmark {
      font-weight: 800; font-size: 17px; letter-spacing: 0.02em;
      text-transform: uppercase; margin-bottom: 14px;
    }
    .wordmark span { color: var(--accent); }
    .rule {
      height: 1px; margin-bottom: 36px;
      background: linear-gradient(90deg, rgba(163,230,53,0.9), rgba(163,230,53,0.15) 60%, rgba(163,230,53,0));
    }
    .card { background: var(--surface); border: 1px solid var(--border); padding: 38px 34px 34px; }
    .label {
      font-family: var(--fmono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent);
      margin-bottom: 18px;
    }
    .label.bad { color: var(--danger); }
    h1 {
      font-weight: 800; font-size: 27px; letter-spacing: -0.02em;
      text-transform: uppercase; line-height: 1.18; margin-bottom: 14px;
    }
    p {
      font-family: var(--fmono); font-size: 13px; line-height: 1.7;
      color: var(--muted); margin-bottom: 26px;
    }
    /* The 3px lime bar from the project cards on the index page. */
    .next {
      border-left: 3px solid var(--accent); background: var(--bg);
      border-top: 1px solid var(--border); border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 16px 18px;
    }
    .next-label {
      font-family: var(--fmono); font-size: 9px; font-weight: 700;
      letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 6px;
    }
    .next-text { font-family: var(--fmono); font-size: 13px; color: var(--text); }
    footer { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); }
    footer p {
      font-family: var(--fmono); font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: #5A5A5A; margin: 0 0 5px;
    }
    footer a { color: #5A5A5A; text-decoration: none; }
    footer .apps { color: #3A3A3A; }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">Lime<span>core</span></div>
    <div class="rule"></div>

    <div class="card">
      <p class="label" id="label">Account confirmed</p>
      <h1 id="title">You're all set</h1>
      <p id="body">Your email address is confirmed. Head back to the app and sign in — that's the last step.</p>
      <div class="next">
        <div class="next-label" id="next-label">Next</div>
        <div class="next-text" id="next-text">Open StudyDesk, LimeLog or Nexus Command Center and sign in.</div>
      </div>
    </div>

    <footer>
      <p><a href="https://limecore.dev">limecore.dev</a></p>
      <p class="apps">NCC &middot; LimeLog &middot; StudyDesk</p>
    </footer>
  </div>

  <script>
    // Supabase verifies the token server-side BEFORE redirecting here, so simply
    // arriving means it worked. Failures arrive as fragment params instead
    // (#error=access_denied&error_code=otp_expired&error_description=...), which
    // is the only case where the default copy above would be a lie.
    (function () {
      var hash = window.location.hash || '';
      var set = function (id, text) { document.getElementById(id).textContent = text; };
      var clearUrl = function () {
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname);
        }
      };

      // limecore#10 — an email change (v1.17). With Secure email change on,
      // Supabase mails a link to the old AND the new address. The first one
      // opened lands here with a `message` param ("... confirm link sent to
      // the other email"); the default "You're all set" would tell the user
      // they are done when the change has not happened yet. The apps add
      // `?flow=email-change` to the link, so the second one can say what
      // actually changed (if that URL is not on Supabase's redirect allow
      // list, Supabase falls back to the plain Site URL and the default copy
      // shows, which is still true).
      if (hash.indexOf('error') === -1) {
        var query = new URLSearchParams(window.location.search);
        var hashParams = new URLSearchParams(hash.replace(/^#/, ''));
        var message = query.get('message') || hashParams.get('message') || '';
        if (message) {
          document.title = 'One more link — Limecore';
          set('label', 'Email change');
          set('title', 'One more link');
          set('body', 'This address is confirmed. A second link went to your other address: open that one too, and the change takes effect once both are confirmed.');
          set('next-text', 'Open the second link, then head back to the app. You stay signed in.');
          clearUrl();
        } else if (query.get('flow') === 'email-change') {
          document.title = 'Email changed — Limecore';
          set('label', 'Email changed');
          set('title', "You're all set");
          set('body', 'Your Limecore account uses the new address from now on, in StudyDesk, NCC and LimeLog.');
          set('next-text', 'Head back to the app. You stay signed in.');
          clearUrl();
        }
        return;
      }

      var params = new URLSearchParams(hash.replace(/^#/, ''));
      var code = params.get('error_code') || params.get('error') || '';
      var expired = code.indexOf('expired') !== -1;

      document.getElementById('label').textContent = 'Link problem';
      document.getElementById('label').className = 'label bad';
      document.getElementById('title').textContent = expired ? 'That link expired' : "That link didn't work";
      document.getElementById('body').textContent = expired
        ? 'Confirmation links are single-use and time-limited. This one is past its window, or it had already been used.'
        : 'The link could not be verified. It may have been used already, or copied incompletely.';
      document.getElementById('next-label').textContent = 'What to do';
      // An email-change link has no code to fall back on (limecore#10).
      document.getElementById('next-text').textContent =
        new URLSearchParams(window.location.search).get('flow') === 'email-change'
          ? 'Your address has not changed. Start the change again from Settings → Account in the app.'
          : 'Open the app and use the 6-digit code from the email instead. If the code is stale too, tap "Send a new code".';

      // Strip the fragment so a refresh doesn't re-show an error for a link that
      // may have succeeded on an earlier attempt.
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    })();
  </script>

  <!-- Ko-fi floating support button -->
  <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
  <script>
    kofiWidgetOverlay.draw('limecorestudio', {
      'type': 'floating-chat',
      'floating-chat.donateButton.text': 'Support me',
      'floating-chat.donateButton.background-color': '#f45d22',
      'floating-chat.donateButton.text-color': '#fff'
    });
  </script>
</body>
</html>
